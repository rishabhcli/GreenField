<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurelia — Thermal stone baths</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root { --stone:#2f3532; --mist:#c5d1c8; --foam:#ede8df; --moss:#7d8f7a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--stone); color:var(--foam); font-family:Lora,Georgia,serif; }
    a { color:inherit; text-decoration:none; }
    img { display:block; width:100%; height:100%; object-fit:cover; }
    nav { padding:28px 40px; display:flex; justify-content:space-between; align-items:center; }
    .mark { font-family:Cinzel,serif; letter-spacing:.38em; font-size:14px; }
    .hours { font-size:13px; color:var(--mist); }
    .hero { position:relative; height:78vh; margin:0 24px; overflow:hidden; }
    .hero img { position:absolute; inset:0; filter:saturate(.8); }
    .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(47,53,50,.1),rgba(47,53,50,.55)); }
    .caption { position:absolute; inset:auto 40px 36px; z-index:1; }
    h1 { font-family:Cinzel,serif; font-size:clamp(36px,6vw,68px); font-weight:400; letter-spacing:.08em; }
    .caption p { margin-top:10px; max-width:42ch; color:var(--mist); font-size:17px; }
    .rooms { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; padding:16px 24px 72px; }
    .room { position:relative; min-height:420px; overflow:hidden; }
    .room img { position:absolute; inset:0; }
    .room figcaption { position:absolute; inset:auto 0 0; padding:24px; background:linear-gradient(transparent,rgba(47,53,50,.8)); }
    .room h2 { font-family:Cinzel,serif; font-size:22px; letter-spacing:.12em; font-weight:400; }
    .room span { display:block; margin-top:6px; color:var(--mist); font-size:14px; }
    .invite { text-align:center; padding:10px 24px 80px; }
    .invite small { display:block; font-family:Cinzel,serif; letter-spacing:.28em; font-size:11px; color:var(--moss); margin-bottom:12px; }
    .invite p { font-size:22px; font-style:italic; max-width:28ch; margin:0 auto; }
    @media (max-width:800px) { .rooms { grid-template-columns:1fr; } .hero { margin:0 12px; height:70vh; } }
  </style>
</head>
<body>
  <nav>
    <a class="mark" href="./aurelia.html">AURELIA</a>
    <span class="hours">Open dusk until late</span>
  </nav>
  <section class="hero">
      <img src="../assets/storefronts/aurelia-1.jpg" alt="Stone soaking room" />
    <div class="caption">
      <h1>Heat, stone, silence.</h1>
      <p>A private thermal house. Mineral water held in carved basins, oils pressed the same morning they are poured.</p>
    </div>
  </section>
  <section class="rooms">
    <figure class="room">
      <img src="../assets/storefronts/aurelia-2.jpg" alt="Oils and linen in the white room" />
      <figcaption><h2>The white room</h2><span>Steam · 90 minutes</span></figcaption>
    </figure>
    <figure class="room">
      <img src="../assets/storefronts/aurelia-3.jpg" alt="Spa still life" />
      <figcaption><h2>Oil house</h2><span>Cedar, vetiver, salt</span></figcaption>
    </figure>
  </section>
  <div class="invite">
    <small>Reservations</small>
    <p>Arrive with an hour. Leave the rest of the evening outside.</p>
  </div>
</body>
</html>
